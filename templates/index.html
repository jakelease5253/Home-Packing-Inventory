<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PackTrack – Web Management Console</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <h1>PackTrack <span class="subtitle">Management Console</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="navigate('stats')" style="color:#fff;border-color:rgba(255,255,255,.3);">Stats</button>
      <button class="btn btn-outline btn-sm" onclick="exportInventory()" style="color:#fff;border-color:rgba(255,255,255,.3);">Export CSV</button>
      <button class="btn btn-outline btn-sm" onclick="printLabels()" style="color:#fff;border-color:rgba(255,255,255,.3);">Print Labels</button>
      <button class="btn btn-outline btn-sm" onclick="printStickers()" style="color:#fff;border-color:rgba(255,255,255,.3);">Print Stickers</button>
    </div>
  </header>

  <div class="container" id="app"></div>
  <div class="toast-container" id="toasts"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
